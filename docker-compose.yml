version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: casino_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: casino_user
      POSTGRES_PASSWORD: casino_password
      POSTGRES_DB: casino_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: casino_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
